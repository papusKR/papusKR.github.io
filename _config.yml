# ─────────────────────────────────────────────
#  Site
# ─────────────────────────────────────────────
title: "papusKR"
name: "papusKR"
role: "Security & Network Engineer"
tagline: "외양간을 고치는 사람이 목표인 사람"
description: "보안운영과 침해대응 기록."
author: "papusKR"
lang: ko-KR

url: "https://papuskr.github.io"
baseurl: ""

# 프로필 이미지. 없으면 이니셜이 표시됩니다.
# avatar: /assets/img/profile.png

email: ""
github_user: ""
linkedin_url: ""

# ─────────────────────────────────────────────
#  Navigation — 아이콘은 _includes/rail.html 에서 지정
# ─────────────────────────────────────────────
navigation:
  - name: "홈"
    link: "/"
    icon: "home"
  - name: "기록"
    link: "/blog/"
    icon: "doc"
  - name: "작업"
    link: "/portfolio/"
    icon: "work"
  - name: "소개"
    link: "/about/"
    icon: "user"

# ─────────────────────────────────────────────
#  Taxonomy
#  categories[0] = 메인. 아래 4개 중에서만.
#  categories[1] = 서브. 자유롭게.
#  카테고리를 추가하면 main.css 상단의 .badge 색도 추가하세요.
# ─────────────────────────────────────────────
main_categories:
  - Detection
  - Analysis
  - Operations
  - Notes

# ─────────────────────────────────────────────
#  Build
# ─────────────────────────────────────────────
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
