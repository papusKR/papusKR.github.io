# ─────────────────────────────────────────────
#  Navigation — 아이콘은 _includes/rail.html 에서 지정
# ─────────────────────────────────────────────
navigation:
  - name: "홈"
    link: "/"
  - name: "기록"
    link: "/blog/"
  - name: "실험실"
    link: "/lab/"
  - name: "소개"
    link: "/about/"

# ─────────────────────────────────────────────
#  Taxonomy
#  categories[0] = 메인. 아래 4개 중에서만.
#  categories[1] = 서브. 자유롭게.
#  카테고리를 추가하면 main.css 상단의 .badge 색도 추가하세요.
# ─────────────────────────────────────────────
main_categories:
  - 보안
  - 네트워크
  - 클라우드
  - AI

# 서브 카테고리는 필요해질 때 글에 바로 쓰면 됩니다. 여기 등록할 필요 없습니다.
# categories: [보안, 스캐닝]  처럼 두 번째 값을 넣으면 알약 필터가 자동 생성됩니다.
# 표기가 갈리지 않도록 아래에 쓰는 이름을 적어두세요.
#   보안:     스캐닝, 웹공격, 탐지룰, 침해분석
#   네트워크: 프로토콜, 방화벽, 트래픽분석
#   클라우드: AWS, 컨테이너, IAM
#   AI:       LLM, 로그분석, 자동화

# ─────────────────────────────────────────────
#  Build
# ─────────────────────────────────────────────
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-sitemap

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
