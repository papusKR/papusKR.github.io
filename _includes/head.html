<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign t = page.title | default: site.title -%}
{%- assign d = page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 -%}
{%- if page.url == "/" -%}<title>{{ site.title }}</title>
{%- else -%}<title>{{ t }} · {{ site.title }}</title>{%- endif -%}
<meta name="description" content="{{ d }}">
<meta name="author" content="{{ site.author }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ t }}">
<meta property="og:description" content="{{ d }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
