{%- assign p = include.post -%}
<article class="card"
         data-cat="{{ p.categories[0] | default: '' }}"
         data-sub="{{ p.categories[1] | default: '' }}">
  <a href="{{ p.url | relative_url }}">
    {% include rec.html post=p %}
    <h3>{{ p.title }}</h3>
    <p>{{ p.description | default: p.excerpt | strip_html | truncate: 110 }}</p>
    <div class="rec"><span class="tags">{% for t in p.tags limit: 3 %}#{{ t }} {% endfor %}</span></div>
  </a>
</article>
