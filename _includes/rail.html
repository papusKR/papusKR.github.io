<div class="navbar">
  <nav class="rail" aria-label="주요 메뉴">
    <a class="rail-mark" href="{{ '/' | relative_url }}">{{ site.name }}</a>
    <div class="menu">
      {%- for item in site.navigation -%}
      {%- assign on = false -%}
      {%- if item.link == "/" and page.url == "/" -%}{%- assign on = true -%}
      {%- elsif item.link != "/" and page.url contains item.link -%}{%- assign on = true -%}
      {%- endif -%}
      <a href="{{ item.link | relative_url }}"{% if on %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {%- endfor -%}
    </div>
  </nav>
</div>
