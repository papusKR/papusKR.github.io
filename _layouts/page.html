---
layout: default
---
<div class="container">
  <header class="post-head">
    {%- if page.eyebrow -%}<p class="eyebrow">{{ page.eyebrow }}</p>{%- endif -%}
    <h1>{{ page.title }}</h1>
    {%- if page.description -%}<p class="lede">{{ page.description }}</p>{%- endif -%}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</div>
